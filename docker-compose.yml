# Purchase Intent Engine: REST API on :8000 (docs at /docs) and dashboard on :8501.
#   docker compose up --build
# Needs trained runs in ./results (scripts 01-06); PIE_MODE picks the dataset.
services:
  api:
    build: .
    image: purchase-intent-engine:latest
    environment:
      PIE_MODE: ${PIE_MODE:-full}
    ports: ["8000:8000"]
    volumes:
      - ./results:/app/results
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    image: purchase-intent-engine:latest
    depends_on: [api]
    command: ["streamlit", "run", "app/main.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports: ["8501:8501"]
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    restart: unless-stopped
